<!doctype html>
<html lang="en"><head><meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Mockup 320px: Activity card states (a) and (c) (TEAM-4162)</title>
<style>
/* =====================================================================
   1. VERBATIM COPY OF src/App.css (out of bounds for the change; copied
      here only so the mockup renders pixel-faithfully).
   ===================================================================== */
.app {
  min-height: 100vh;
  background-color: #ffffff;
  color: #0f172a;
  font-family: Inter, system-ui, -apple-system, sans-serif;
}
.settings {
  max-width: 640px;
  margin: 0 auto;
  padding: 2rem 1.5rem;
}
.settings__title {
  font-size: 1.5rem;
  font-weight: 700;
  color: #0f172a;
  margin: 0 0 2rem;
}
.settings__section {
  margin-bottom: 2rem;
  padding: 1.5rem;
  background: #ffffff;
  border: 1px solid #e2e8f0;
  border-radius: 12px;
}
.settings__section h2 {
  font-size: 1.125rem;
  font-weight: 600;
  color: #0f172a;
  margin: 0 0 0.5rem;
}
.settings__section p {
  font-size: 0.875rem;
  color: #475569;
  margin: 0;
}
.settings__control {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 1rem;
  margin-top: 1rem;
  padding-top: 1rem;
  border-top: 1px solid #e2e8f0;
}
.settings__control-title {
  color: #0f172a;
  font-size: 0.875rem;
  font-weight: 600;
  margin: 0 0 0.25rem;
}
.settings__control-description {
  color: #475569;
  font-size: 0.75rem;
  line-height: 1.5;
  margin: 0;
}
.settings__toggle {
  flex: 0 0 auto;
  min-width: 3.5rem;
  padding: 0.5rem 0.875rem;
  border: 1px solid #e2e8f0;
  border-radius: 999px;
  background: #ffffff;
  color: #475569;
  cursor: pointer;
  font: inherit;
  font-size: 0.75rem;
  font-weight: 700;
}
.settings__toggle[aria-pressed='true'] {
  background: #0f172a;
  border-color: #0f172a;
  color: #ffffff;
}

/* =====================================================================
   2. VERBATIM COPY OF src/activity/ActivityFeed.css (current contents)
   ===================================================================== */
.activity-feed__list {
  list-style: none;
  margin: 1rem 0 0;
  padding: 0;
}
.activity-feed__item {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 1rem;
  padding: 0.875rem 0;
}
.activity-feed__item:first-child {
  padding-top: 0;
}
.activity-feed__item + .activity-feed__item {
  border-top: 1px solid #e2e8f0;
}
.activity-feed__content {
  min-width: 0;
}
.activity-feed__type {
  display: block;
  margin-bottom: 0.25rem;
  color: #0f172a;
  font-size: 0.75rem;
  font-weight: 700;
  letter-spacing: 0.04em;
  line-height: 1.4;
  text-transform: uppercase;
}
.activity-feed__description {
  color: #475569;
  font-size: 0.875rem;
  line-height: 1.5;
  margin: 0;
  overflow-wrap: anywhere;
}
.activity-feed__time {
  flex: 0 0 auto;
  color: #475569;
  font-size: 0.75rem;
  line-height: 1.5;
  text-align: right;
  white-space: nowrap;
}
.activity-feed__empty {
  color: #475569;
  font-size: 0.875rem;
  line-height: 1.5;
  margin: 1rem 0 0;
}
@media (max-width: 400px) {
  .activity-feed__item {
    flex-wrap: wrap;
  }
  .activity-feed__time {
    flex-basis: 100%;
    text-align: left;
    margin-top: 0.125rem;
  }
}

/* =====================================================================
   3. PROPOSED DELTA — to be appended to src/activity/ActivityFeed.css
      (identical to the "Implementer notes" block in frontend-designer.md)
   ===================================================================== */

/* Section header row: heading left, Clear activity right, wraps when the
   row is narrower than heading + button (happens at 320px). */
.activity-feed__header {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 0.5rem 1rem;
  margin-bottom: 0.5rem;
}

/* Heading inside the header row: the row now owns the 0.5rem bottom gap
   (0,2,0 beats .settings__section h2 at 0,1,1). tabIndex=-1 landing spot,
   not a control, so no focus ring. */
.activity-feed__header .activity-feed__title {
  min-width: 0;
  margin: 0;
}
.activity-feed__title:focus {
  outline: none;
}

/* Shared pill button (Clear activity, Undo). Resting style matches
   .settings__toggle in App.css; min-height 2.75rem = 44px target. */
.activity-feed__button {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex: 0 0 auto;
  max-width: 100%;
  min-height: 2.75rem;
  padding: 0.5rem 0.875rem;
  border: 1px solid #e2e8f0;
  border-radius: 999px;
  background: #ffffff;
  color: #475569;
  cursor: pointer;
  font: inherit;
  font-size: 0.75rem;
  font-weight: 700;
  line-height: 1.5;
  text-align: center;
}
.activity-feed__button:hover,
.activity-feed__button:active {
  background: #0f172a;
  border-color: #0f172a;
  color: #ffffff;
}
.activity-feed__button:focus-visible {
  outline: 2px solid #0f172a;
  outline-offset: 2px;
}

/* Notice row: always mounted; holds the role="status" line and, while the
   undo window is open, the Undo button. Only takes vertical space when it
   has content (modifier toggled by the component). */
.activity-feed__notice {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 0.5rem 1rem;
  margin: 0;
}
.activity-feed__notice--active {
  margin-top: 1rem;
}
.activity-feed__status {
  flex: 1 1 auto;
  min-width: 0;
  color: #475569;
  font-size: 0.875rem;
  line-height: 1.5;
  margin: 0;
  overflow-wrap: anywhere;
}
.activity-feed__status:empty {
  display: none;
}

/* =====================================================================
   4. MOCKUP-ONLY scaffolding (NOT part of the change): panel frame,
      labels, and static stand-ins for :hover / :focus-visible so several
      states can be shown at once.
   ===================================================================== */
body { margin: 0; background: #e2e8f0; font-family: Inter, system-ui, -apple-system, sans-serif; color: #0f172a; }
.mock-header { padding: 1.5rem; }
.mock-header h1 { font-size: 1.125rem; margin: 0 0 0.25rem; }
.mock-header p { font-size: 0.875rem; color: #475569; margin: 0; }
.mock-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1.5rem; padding: 0 1.5rem 1.5rem; }
.mock-panel { background: #ffffff; border: 1px solid #475569; border-radius: 12px; overflow: hidden; }
.mock-panel__label { padding: 0.5rem 1rem; border-bottom: 1px solid #e2e8f0; font-size: 0.75rem; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; color: #475569; background: #ffffff; }
.mock-panel .app { min-height: 0; }
.mock-note { padding: 0.5rem 1rem 0.875rem; font-size: 0.75rem; color: #475569; border-top: 1px solid #e2e8f0; }
/* stand-ins */
.activity-feed__button.is-hover { background: #0f172a; border-color: #0f172a; color: #ffffff; }
.activity-feed__button.is-focus-visible { outline: 2px solid #0f172a; outline-offset: 2px; }
@media (max-width: 1100px) { .mock-grid { grid-template-columns: 1fr; } }

/* 320 mockup-only */
body { background: #ffffff; }
.mock-label { font-size: 0.75rem; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; color: #475569; margin: 0 0 0.5rem; }
</style></head>
<body>
<div class="app"><div class="settings">
  <p class="mock-label">(a) Default at 320px</p>
  
<section class="settings__section activity-feed" aria-labelledby="a-title">
  <div class="activity-feed__header">
    <h2 id="a-title" class="activity-feed__title" tabindex="-1">Recent Activity</h2>
    <button type="button" class="activity-feed__button">Clear activity</button>
  </div>
  <div class="activity-feed__notice">
    <p role="status" class="activity-feed__status"></p>
    
  </div>
  <ul class="activity-feed__list" aria-live="polite">
    <li class="activity-feed__item"><div class="activity-feed__content"><span class="activity-feed__type">settings</span><p class="activity-feed__description">Turned email notifications off.</p></div><time class="activity-feed__time">just now</time></li>
    <li class="activity-feed__item"><div class="activity-feed__content"><span class="activity-feed__type">settings</span><p class="activity-feed__description">Turned email notifications on.</p></div><time class="activity-feed__time">2m ago</time></li>
    <li class="activity-feed__item"><div class="activity-feed__content"><span class="activity-feed__type">settings</span><p class="activity-feed__description">Turned email notifications off.</p></div><time class="activity-feed__time">1h ago</time></li>
  </ul>
</section>
  <p class="mock-label">(c) Cleared with Undo at 320px</p>
  
<section class="settings__section activity-feed" aria-labelledby="c-title">
  <div class="activity-feed__header">
    <h2 id="c-title" class="activity-feed__title" tabindex="-1">Recent Activity</h2>
    
  </div>
  <div class="activity-feed__notice activity-feed__notice--active">
    <p role="status" class="activity-feed__status">Activity cleared.</p>
    <button type="button" class="activity-feed__button is-focus-visible">Undo</button>
  </div>
  
</section>
</div></div>
</body></html>
